name: Compilar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar o YT Downloader
        shell: pwsh
        run: ./build-ci.ps1

      # Arquivo para testar antes de publicar (aparece na pagina da execucao, em "Artifacts").
      - name: Guardar o .exe para teste
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-teste
          path: dist/YT-Downloader.exe
          retention-days: 14

      # So publica a Release (e dispara a atualizacao automatica) a partir da main.
      - name: Publicar a versao (Releases)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info = Get-Content latest.json -Raw | ConvertFrom-Json
          $tag = "v$($info.version)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/YT-Downloader.exe --clobber
          } else {
            gh release create $tag dist/YT-Downloader.exe --target $env:GITHUB_SHA --title "YT Downloader $tag" --notes "$($info.notes)"
          }
